name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Paketlar
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Eski keshni tozalash
        run: |
          rm -rf ~/.buildozer

      - name: APK yaratish
        run: |
          buildozer android debug

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: 4-sinf-test-apk
          path: bin/*.apk
